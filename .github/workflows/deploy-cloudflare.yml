name: Deploy to Cloudflare

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify D1 configuration
        run: |
          if grep -q '00000000-0000-4000-8000-000000000000' wrangler.jsonc; then
            echo 'Replace the placeholder D1 database_id in wrangler.jsonc before deploying.' >&2
            exit 1
          fi
      - run: npm run db:migrate:remote
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
